name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  # Cheap always-on gate: lint, typecheck, and a couple of repo-specific
  # static checks. Runs on every push and PR. Fails fast so a broken master
  # never gets to the expensive jobs below.
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Enforce rng_mm usage (no random in combat/affects)
        # The combat and affects modules must use mud.utils.rng_mm, not
        # the stdlib random module — see INV-053 for the determinism contract.
        run: |
          if grep -R -n "\\brandom\\." mud/combat mud/affects; then
            echo "Forbidden Python random.* usage found in combat/affects." >&2
            exit 1
          else
            echo "OK: no random.* usage in combat/affects"
          fi
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format check)
        run: ruff format --check .
      - name: mypy
        # Scoped to the network + security modules. Results are advisory —
        # type errors are logged but do not fail the lint gate. Set
        # continue-on-error so the job stays yellow (not red) on mypy issues.
        continue-on-error: true
        run: mypy mud/net/ansi.py mud/net/protocol.py mud/net/connection.py mud/security/hash_utils.py

  # Full suite on the version the pinned lock is built + proven green against
  # (local .venv is 3.12.3). Installing requirements.txt gives the exact
  # known-good stack (pytest 8.x etc.) — the unpinned `.[dev,test]` floors
  # resolve to bleeding-edge pytest 9 / xdist 3.8, which crash xdist workers
  # ("node down: Not properly terminated") and abort the run with an
  # INTERNALERROR. See CHANGELOG 2.14.267.
  #
  # Cost: this run is ~32 CI-min. It is therefore gated to pull_request +
  # manual dispatch only — direct pushes to master run just the cheap jobs
  # above. The dev validates the full suite locally via .venv. See 2.14.268.
  test:
    name: Full suite (Python 3.12, pinned)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Test with pytest
        # Inherits addopts (--timeout=120) from pyproject.toml. The xdist
        # addopt is -n0, so this run is serial and stable on every runner.
        #
        # The .are -> .json conversion scripts (area/help.are, area/*.are, etc.)
        # are exercised by tests/test_help_conversion.py,
        # tests/test_are_conversion.py, tests/test_shop_conversion.py, and
        # tests/test_social_conversion.py — no separate CI drift check
        # needed. The .are files are kept as frozen ROM 2.4 reference data;
        # data/*.json is the runtime source and has entries the .are doesn't
        # (added by the previous author during ROM-parity work).
        run: pytest --tb=short

  # Optional: runs the ROM 2.4 parity harness in tests/integration/ on push
  # to main. ~3000 tests, ~4 min. Off the default PR path because the
  # project no longer treats parity as a goal. See make test-parity to run
  # locally.
  parity-tests:
    name: ROM Parity Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run parity tests
        run: pytest tests/integration/ --include-parity -q --tb=line --timeout=60

  # Linux-only — opens real sockets. The `runs-on: ubuntu-latest` is always
  # Linux so no separate os gate is needed (and `runner.os` is not a valid
  # job-level if: named-value in GitHub Actions).
  telnet-tests:
    name: Telnet Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run telnet tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -q -m telnet
